<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All-in-One HTTP Basics with JavaScript</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 800px; }
    button { padding: 10px 15px; margin: 5px 5px 15px 0; cursor: pointer; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>

  <h1>HTTP Concepts Masterclass</h1>
  <p>Click the buttons below to trigger real HTTP requests and inspect the raw structures in the box below (and in your Browser Console).</p>

  <button id="btn-get">1. GET & URL Encoding</button>
  <button id="btn-post">2. POST, Entity Body & Security</button>
  <button id="btn-cache">3. Caching & Headers</button>
  <button id="btn-status">4. Status Codes (404 Error)</button>

  <pre id="console-output">Click a button to execute an HTTP transaction...</pre>

  <script>
    const output = document.getElementById("console-output");
    const log = (title, data) => {
      const formatted = `\n=== ${title} ===\n${typeof data === "object" ? JSON.stringify(data, null, 2) : data}`;
      output.textContent += formatted + "\n";
      console.log(title, data);
    };

    // =========================================================================
    // 1. HTTP METHODS (GET), URL STRUCTURE & URL ENCODING
    // =========================================================================
    // URLs cannot contain spaces or special characters directly.
    // encodeURIComponent() converts unsafe characters into %XX hex format.
    document.getElementById("btn-get").addEventListener("click", async () => {
      output.textContent = "Sending GET Request...";

      const rawSearchQuery = "JavaScript & HTTP/2 Basics!";
      const encodedQuery = encodeURIComponent(rawSearchQuery); // "JavaScript%20%26%20HTTP%2F2%20Basics!"
      
      // Constructing the URL with Query Parameters
      const url = `https://httpbin.org{encodedQuery}&page=1`;

      // Sending HTTP GET Request
      const response = await fetch(url, { method: "GET" });
      const data = await response.json();

      log("URL ENCODING", { Original: rawSearchQuery, Encoded: encodedQuery, FullURL: url });
      log("HTTP RESPONSE STATUS", `${response.status} ${response.statusText}`); // 200 OK
      log("SERVER RECEIVED PARAMS", data.args);
    });

    // =========================================================================
    // 2. HTTP MESSAGE STRUCTURE, POST METHOD, ENTITY BODY & SECURITY
    // =========================================================================
    // An HTTP Message consists of:
    //   1. Start Line (Method + Target + HTTP Version, e.g., POST /post HTTP/1.1)
    //   2. Headers (Metadata about the request/client)
    //   3. Empty Line (Separates headers from body)
    //   4. Entity Body (The actual data payload being transmitted)
    document.getElementById("btn-post").addEventListener("click", async () => {
      output.textContent = "Sending POST Request with Entity Body & Auth...";

      // Entity Body (Payload)
      const entityPayload = {
        username: "dev_alex",
        action: "update_profile"
      };

      // HTTP Security: HTTPS encrypts data in transit; Authorization header proves identity
      const fakeJwtToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mockToken";

      const response = await fetch("https://httpbin.org", {
        method: "POST", // Other methods: PUT (replace), PATCH (modify), DELETE (remove)
        headers: {
          // Entity Headers (describe the body format and size)
          "Content-Type": "application/json",
          // Security Header (Bearer Token authentication)
          "Authorization": `Bearer ${fakeJwtToken}`,
          // Custom Header
          "X-Client-App": "JS-HTTP-Demo"
        },
        // Convert JS object into a JSON string for the HTTP Entity Body
        body: JSON.stringify(entityPayload)
      });

      const responseData = await response.json();

      log("REQUEST HEADERS SENT", responseData.headers);
      log("ENTITY BODY SENT", responseData.json);
    });

    // =========================================================================
    // 3. HTTP CACHING & RESPONSE HEADERS
    // =========================================================================
    // Caching stores copies of responses to reduce bandwidth and latency.
    // Controlled via 'Cache-Control', 'ETag', and 'Expires' headers.
    document.getElementById("btn-cache").addEventListener("click", async () => {
      output.textContent = "Testing HTTP Caching Headers...";

      // Requesting a resource with Cache-Control directives
      const response = await fetch("https://httpbin.org", {
        method: "GET",
        // Browser Fetch API cache mode ('default', 'no-store', 'reload', 'force-cache')
        cache: "default",
        headers: {
          "Cache-Control": "max-age=60" // Tells caches this response is fresh for 60 seconds
        }
      });

      // Reading Response Headers sent back by the server
      const responseHeaders = {};
      response.headers.forEach((value, key) => {
        responseHeaders[key] = value;
      });

      log("CACHE RESPONSE STATUS", `${response.status} (200 = Fresh, 304 = Not Modified)`);
      log("RESPONSE ENTITY & CACHE HEADERS", responseHeaders);
    });

    // =========================================================================
    // 4. HTTP STATUS CODES (1xx, 2xx, 3xx, 4xx, 5xx)
    // =========================================================================
    document.getElementById("btn-status").addEventListener("click", async () => {
      output.textContent = "Simulating a 404 Not Found Status Code...";

      // Requesting an endpoint that intentionally returns a 404 status
      const response = await fetch("https://httpbin.org");

      // Note: fetch() does NOT reject on 404 or 500 errors; you must check response.ok!
      if (!response.ok) {
        log("HTTP ERROR CAUGHT", {
          StatusCode: response.status,
          Category: "4xx Client Error",
          Meaning: "The requested resource could not be found on the server."
        });
      }
    });
  </script>
</body>
</html>
